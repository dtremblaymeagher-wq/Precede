<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PM AI Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Injects window.__CLERK_PK__ from the server's CLERK_PUBLISHABLE_KEY env var -->
    <script src="/clerk-key.js"></script>
    <!-- Load Clerk without a hardcoded key; key is passed programmatically below -->
    <script src="https://unpkg.com/@clerk/clerk-js@4/dist/clerk.browser.js"
            type="text/javascript" crossorigin="anonymous"></script>
</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-700 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/public/asset/precede-logo-dark-transparent.png" alt="Precede" class="h-10 mx-auto mb-4">
            <p class="text-slate-400 text-sm font-medium">Sign in to continue</p>
        </div>
        <div id="sign-in"></div>
    </div>

    <script>
        // Clear any stale Clerk hash (e.g. #/factor-two from a previous stuck session)
        // so the component always starts fresh.
        if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        (async () => {
            // Instantiate Clerk with the key served dynamically from the server
            // (window.__CLERK_PK__ is set by /clerk-key.js which reads CLERK_PUBLISHABLE_KEY).
            const clerk = new window.Clerk(window.__CLERK_PK__);
            await clerk.load();

            const params      = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('redirect') || '/dashboard.html';
            const mode        = params.get('mode');

            if (clerk.user) {
                window.location.href = redirectUrl;
                return;
            }

            const el = document.getElementById('sign-in');

            if (mode === 'signup') {
                clerk.mountSignUp(el, {
                    routing:        'hash',
                    afterSignUpUrl: '/onboarding.html',
                    signInUrl:      '/login.html',
                });
            } else {
                clerk.mountSignIn(el, {
                    routing:        'hash',
                    afterSignInUrl: redirectUrl,
                    afterSignUpUrl: '/onboarding.html',
                    signUpUrl:      '/login.html?mode=signup',
                });
            }
        })();
    </script>
</body>
</html>
