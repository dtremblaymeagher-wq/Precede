<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting History — PM AI Toolkit</title>
    <link rel="stylesheet" href="/shared/style.generated.css">
    <script src="https://unpkg.com/@clerk/clerk-js@5/dist/clerk.browser.js"
            data-clerk-publishable-key="pk_test_dmFzdC1wZWdhc3VzLTQzLmNsZXJrLmFjY291bnRzLmRldiQ"
            type="text/javascript" crossorigin="anonymous"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/sidebar-component.js"></script>
    <link rel="stylesheet" href="/shared/design-tokens.css">
    <link rel="stylesheet" href="/shared/layout.css">
    <link rel="stylesheet" href="/shared/secondary-nav.css">
    <style>
        .page-title {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin-bottom: 6px;
            letter-spacing: var(--letter-spacing-tight);
        }
        .page-subtitle {
            font-size: var(--font-size-base);
            color: var(--color-text-secondary);
            margin-bottom: 24px;
        }
        .search-bar {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            outline: none;
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
            font-family: var(--font-family);
            transition: border-color 0.15s, box-shadow 0.15s;
            width: 100%;
        }
        .search-bar:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-border); }
        .search-bar::placeholder { color: var(--color-text-muted); }

        .filter-select {
            appearance: none;
            background: var(--color-bg-page);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            outline: none;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
            font-family: var(--font-family);
            transition: border-color 0.15s;
            width: 100%;
        }
        .filter-select:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-border); }

        .tree-container {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-top: 24px;
            box-shadow: var(--shadow-card);
            min-height: calc(100vh - 380px);
        }

        .file-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            background: var(--color-bg-page);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            margin-bottom: 6px;
            transition: all 0.15s;
            cursor: pointer;
        }
        .file-item:hover { background: var(--color-bg-surface); border-color: var(--color-accent); box-shadow: var(--shadow-card); }

        .file-content { flex: 1; min-width: 0; }

        .file-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }

        .file-title { font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); color: var(--color-text-primary); }

        .file-date { font-size: var(--font-size-xs); color: var(--color-text-secondary); }

        .file-meta { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }

        .meta-tag {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            padding: 1px 6px;
            border-radius: 4px;
            display: inline-block;
        }
        .meta-format { background: var(--color-success-subtle); color: var(--color-success); }
        .meta-radar  { background: var(--color-accent-subtle);  color: var(--color-accent); }

        .file-preview {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .toggle-icon { font-size: 12px; color: var(--color-text-muted); flex-shrink: 0; margin-top: 3px; }

        .detail-panel { display: none; margin-top: 10px; border-top: 1px solid var(--color-border); padding-top: 12px; }
        .detail-panel.open { display: block; }

        .detail-secret {
            background: #0f172a;
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 8px;
        }
        .detail-public {
            background: var(--color-bg-hover);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 8px;
        }
        .detail-label {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wider);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn {
            padding: 3px 8px;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            font-size: 10px;
            font-weight: var(--font-weight-bold);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font-family);
            background: var(--color-bg-hover);
            color: var(--color-text-secondary);
        }
        .action-btn:hover { background: var(--color-accent); color: white; border-color: var(--color-accent); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--color-text-secondary); }
        .empty-icon  { font-size: 48px; opacity: 0.3; margin-bottom: 16px; }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <aside class="sidebar flex flex-col" style="padding: 20px 12px 14px;"></aside>

    <nav class="secondary-sidebar">
        <div class="secondary-sidebar-title">Meeting Center</div>
        <a class="sec-nav-item" href="/Modules/meeting-strategist/meeting-center.html">Meeting Prep</a>
        <a class="sec-nav-item" href="/Modules/meeting-strategist/meeting-center.html">Post-Meeting</a>
    </nav>

    <div class="main-content">
        <div>
            <h1 class="page-title">Meeting History</h1>
            <p class="page-subtitle">Browse and review all your saved meeting preparation notes.</p>

            <!-- Search and Filters -->
            <div style="background: var(--color-bg-surface); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: 24px; margin-bottom: 32px; box-shadow: var(--shadow-card);">
                <div style="display: grid; grid-template-columns: 1fr 160px 160px 160px; gap: 16px; align-items: end;">
                    <div>
                        <label style="font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--letter-spacing-wider); display: block; margin-bottom: 8px;">Search</label>
                        <input id="filter-search" type="text" class="search-bar" placeholder="Search by title or counterpart…" oninput="applyFilters()">
                    </div>
                    <div>
                        <label style="font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--letter-spacing-wider); display: block; margin-bottom: 8px;">From</label>
                        <input id="filter-date-from" type="date" class="filter-select" onchange="applyFilters()">
                    </div>
                    <div>
                        <label style="font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--letter-spacing-wider); display: block; margin-bottom: 8px;">To</label>
                        <input id="filter-date-to" type="date" class="filter-select" onchange="applyFilters()">
                    </div>
                    <div>
                        <label style="font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--letter-spacing-wider); display: block; margin-bottom: 8px;">Sort</label>
                        <select id="sort-by" class="filter-select" onchange="applyFilters()">
                            <option value="date-desc">Newest first</option>
                            <option value="date-asc">Oldest first</option>
                            <option value="title-asc">Title A → Z</option>
                            <option value="title-desc">Title Z → A</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Results Summary -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">
                    Showing <span id="results-count">0</span> preparation(s)
                </div>
                <button id="btn-clear" onclick="clearFilters()" style="display:none; padding: 8px 16px; background: var(--color-bg-hover); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-secondary); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: var(--letter-spacing-wider); cursor: pointer;">
                    Clear Filters
                </button>
            </div>

            <!-- Tree container -->
            <div class="tree-container">
                <div style="font-size: var(--font-size-base); font-weight: var(--font-weight-bold); color: var(--color-text-primary); margin-bottom: 16px;">
                    📁 Meeting Preparations
                </div>

                <!-- Loading skeletons -->
                <div id="loading-state">
                    <div style="height:56px;margin-bottom:8px;background:linear-gradient(90deg,var(--color-border) 25%,var(--color-bg-hover) 50%,var(--color-border) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--radius-xl);"></div>
                    <div style="height:48px;margin-bottom:6px;background:linear-gradient(90deg,var(--color-border) 25%,var(--color-bg-hover) 50%,var(--color-border) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--radius-xl);"></div>
                    <div style="height:48px;margin-bottom:6px;background:linear-gradient(90deg,var(--color-border) 25%,var(--color-bg-hover) 50%,var(--color-border) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--radius-xl);"></div>
                </div>

                <div id="history-list"></div>

                <!-- Empty state -->
                <div id="empty-state" class="empty-state" style="display:none;">
                    <div class="empty-icon">📭</div>
                    <div style="font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary); margin-bottom: 8px;">No meeting preps saved yet.</div>
                    <div style="font-size: var(--font-size-sm);">Generate a strategy and click <strong>Save to Hub</strong> in Meeting Prep.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="meeting-history.js"></script>
</body>
</html>
