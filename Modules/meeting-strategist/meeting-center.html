<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meeting Center - PM AI</title>
    <script src="https://unpkg.com/@clerk/clerk-js@5/dist/clerk.browser.js"
            data-clerk-publishable-key="pk_test_dmFzdC1wZWdhc3VzLTQzLmNsZXJrLmFjY291bnRzLmRldiQ"
            type="text/javascript" crossorigin="anonymous"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/sidebar-component.js"></script>
    <link rel="stylesheet" href="/shared/design-tokens.css">
    <link rel="stylesheet" href="/shared/layout.css">
    <link rel="stylesheet" href="/shared/secondary-nav.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block !important; }
        .tab-active { border-bottom: 3px solid var(--color-accent); color: var(--color-accent); font-weight: var(--font-weight-bold); }
        .main-content { padding: 2rem; margin-left: 400px; }
    </style>
</head>
<body>
    <aside class="sidebar flex flex-col" style="padding: 20px 12px 14px;"><!-- Content will be replaced by sidebar-component.js --></aside>

    <nav class="secondary-sidebar">
        <div class="secondary-sidebar-title">Meeting Center</div>
        <button class="sec-nav-item active" id="btn-prep" onclick="switchTab('prep')">Meeting Prep</button>
        <button class="sec-nav-item" id="btn-summary" onclick="switchTab('summary')">Post-Meeting</button>
        <a class="sec-nav-item" href="/Modules/meeting-strategist/meeting-history.html">History</a>
    </nav>

    <div class="main-content">
        <div style="padding: 8px 0 32px; max-width: 1100px; margin: 0 auto;">
            <header style="margin-bottom: 28px;">
                <h1 style="font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); color: var(--color-text-primary); letter-spacing: var(--letter-spacing-tight);">Meeting Center</h1>
            </header>

            <div id="section-prep" class="tab-content active">
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 28px;">
                    <div>
                        <div class="ds-card" style="padding: 24px;">
                            <h3 style="font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); color: var(--color-text-primary); margin: 0 0 20px;">Parameters</h3>
                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <div>
                                    <label style="display:block; font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); color:var(--color-text-muted); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); margin-bottom:6px;">Counterpart</label>
                                    <select id="prep-actor" class="ds-input"></select>
                                </div>
                                <div>
                                    <label style="display:block; font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); color:var(--color-text-muted); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); margin-bottom:6px;">Main Objective</label>
                                    <textarea id="prep-subject" rows="3" class="ds-input" placeholder="E.g., Validate the specs..."></textarea>
                                </div>
                                <div>
                                    <label style="display:block; font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); color:var(--color-text-muted); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); margin-bottom:6px;">Additional Context</label>
                                    <textarea id="prep-context" rows="3" class="ds-input" placeholder="Figma link, docs..."></textarea>
                                </div>
                                <button id="prep-generate" class="btn-primary" style="width:100%; padding:14px; font-size:var(--font-size-xs); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); font-weight:var(--font-weight-bold);">Generate Strategy</button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div id="prep-result" style="display:none; flex-direction:column; gap:20px;">
                            <div class="ds-card" style="border-left: 4px solid var(--color-accent);">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                                    <span style="background:var(--color-accent-subtle); color:var(--color-accent); font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); padding:3px 10px; border-radius:9999px; text-transform:uppercase; letter-spacing:var(--letter-spacing-wider);">Secret Brief</span>
                                    <button onclick="savePrepToHub()" id="btn-save-prep" class="btn-secondary" style="font-size:var(--font-size-xs); padding:5px 12px;">Save to Hub</button>
                                </div>
                                <div id="prep-content-secret" style="color:var(--color-text-secondary); font-size:var(--font-size-base); white-space:pre-wrap;"></div>
                            </div>
                            <div class="ds-card">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--color-border);">
                                    <span style="color:var(--color-text-muted); font-weight:var(--font-weight-bold); font-size:var(--font-size-xs); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider);">Public Agenda</span>
                                    <button onclick="copyToClipboard('prep-content-public')" class="btn-ghost" style="font-size:var(--font-size-xs);">Copy</button>
                                </div>
                                <div id="prep-content-public" style="color:var(--color-text-primary); font-size:var(--font-size-base); white-space:pre-wrap; font-style:italic;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="section-summary" class="tab-content">
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 28px;">
                    <div>
                        <div class="ds-card" style="padding: 24px;">
                            <h3 style="font-weight: var(--font-weight-bold); font-size: var(--font-size-md); color: var(--color-text-primary); margin: 0 0 16px;">Structured Inputs</h3>
                            <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px;">
                                <div>
                                    <label style="display:block; font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); color:var(--color-accent); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); margin-bottom:4px;">Key Decision (Anchor)</label>
                                    <input id="sum-decision" type="text" class="ds-input" placeholder="E.g., Go for V2">
                                </div>
                                <div>
                                    <label style="display:block; font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); color:var(--color-accent); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); margin-bottom:4px;">Follow-up Date</label>
                                    <input id="sum-next-date" type="date" class="ds-input">
                                </div>
                                <div>
                                    <label style="display:block; font-size:var(--font-size-xs); font-weight:var(--font-weight-bold); color:var(--color-accent); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); margin-bottom:4px;">Attendees</label>
                                    <input id="sum-attendees" type="text" class="ds-input" placeholder="John, Mary...">
                                </div>
                            </div>

                            <h3 style="font-weight: var(--font-weight-bold); font-size: var(--font-size-md); color: var(--color-text-primary); margin: 0 0 8px;">Raw Notes</h3>
                            <textarea id="sum-notes" rows="12" class="ds-input" style="font-family:monospace; font-size:var(--font-size-xs);" placeholder="Paste your transcript here..."></textarea>

                            <button id="sum-generate" class="btn-primary" style="width:100%; padding:14px; margin-top:14px; font-size:var(--font-size-xs); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider); font-weight:var(--font-weight-bold);">Synthesize with AI</button>
                        </div>
                    </div>

                    <div>
                        <div id="sum-result" style="display:none; flex-direction:column; gap:20px;">
                            <div class="ds-card">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--color-border);">
                                    <span style="color:var(--color-accent); font-weight:var(--font-weight-bold); font-size:var(--font-size-xs); text-transform:uppercase; letter-spacing:var(--letter-spacing-wider);">Decision Summary</span>
                                    <div style="display:flex; gap:12px;">
                                        <button onclick="shareSummaryByEmail()" class="btn-ghost" style="font-size:var(--font-size-xs);">Email</button>
                                        <button onclick="copyToClipboard('sum-content')" class="btn-ghost" style="font-size:var(--font-size-xs);">Copy</button>
                                    </div>
                                </div>
                                <div id="sum-content" style="color:var(--color-text-primary); font-size:var(--font-size-base); line-height:var(--line-height-relaxed); white-space:pre-wrap;"></div>
                            </div>
                            <div style="background:var(--color-success-subtle); border:2px dashed var(--color-success); border-radius:var(--radius-lg); padding:24px;">
                                <h4 style="color:var(--color-success); font-weight:var(--font-weight-bold); margin:0 0 8px;">Strategic Insight</h4>
                                <p id="sum-insight" style="color:var(--color-text-secondary); font-size:var(--font-size-base); font-style:italic; margin:0 0 20px;"></p>
                                <button id="sum-save-hub" style="background:var(--color-success); color:white; border:none; padding:10px 24px; border-radius:var(--radius-md); font-weight:var(--font-weight-bold); font-size:var(--font-size-base); cursor:pointer; font-family:var(--font-family);">Archive to Hub</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="meeting-center.js"></script>
</body>
</html>
