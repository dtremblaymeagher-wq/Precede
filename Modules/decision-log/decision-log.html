<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Log — PM AI Toolkit</title>
    <link rel="stylesheet" href="/shared/style.generated.css">
    <script src="https://unpkg.com/@clerk/clerk-js@5/dist/clerk.browser.js"
            data-clerk-publishable-key="pk_test_dmFzdC1wZWdhc3VzLTQzLmNsZXJrLmFjY291bnRzLmRldiQ"
            type="text/javascript" crossorigin="anonymous"></script>
    <script src="/shared/auth.js"></script>
    <link rel="stylesheet" href="/shared/design-tokens.css">
    <link rel="stylesheet" href="/shared/layout.css">
    <style>
        /* ── Layout override ─────────────────────────────────────────────────── */
        .main-content {
            padding-left: 28px !important;
            padding-right: 28px !important;
            padding-top: calc(var(--header-height, 56px) + 28px) !important;
        }
        .dl-layout {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .dl-header {
            margin-bottom: 4px;
        }

        /* ── Custom styles ───────────────────────────────────────────────────── */
        .decision-card {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 20px 24px;
            box-shadow: var(--shadow-card);
            transition: all 0.15s;
            margin-bottom: 16px;
        }
        .decision-card:hover {
            box-shadow: var(--shadow-hover);
        }
        .decision-card.approved {
            border-left: 4px solid var(--color-success);
            background: var(--color-success-subtle);
        }
        .decision-card.pending {
            border-left: 4px solid var(--color-warning);
            background: var(--color-warning-subtle);
        }
        .decision-card.awaiting_acknowledgment {
            border-left: 4px solid var(--color-info);
            background: var(--color-info-subtle);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wider);
        }
        .status-badge.pending {
            background: var(--color-warning-subtle);
            color: var(--color-warning);
            border: 1px solid var(--color-warning-border);
        }
        .status-badge.approved {
            background: var(--color-success-subtle);
            color: var(--color-success);
            border: 1px solid var(--color-success-border);
        }
        .status-badge.awaiting_acknowledgment {
            background: var(--color-info-subtle);
            color: var(--color-info);
            border: 1px solid rgba(74,106,140,0.3);
        }
        .status-badge.escalated {
            background: var(--color-warning);
            color: var(--color-text-inverse);
            border: 1px solid var(--color-warning-border);
            font-weight: var(--font-weight-bold);
        }

        /* ── Exec response box ───────────────────────────────────────────────── */
        .exec-response-box {
            margin: 14px 0;
            padding: 14px 16px;
            background: var(--color-info-subtle);
            border: 1px solid rgba(74,106,140,0.25);
            border-left: 3px solid var(--color-info);
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
        }
        .exec-response-label {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wider);
            color: var(--color-info);
            margin-bottom: 8px;
        }
        .exec-response-text {
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
            font-weight: var(--font-weight-medium);
            margin-bottom: 6px;
            line-height: var(--line-height-relaxed);
        }
        .exec-response-rationale {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            font-style: italic;
            line-height: var(--line-height-relaxed);
            margin-bottom: 6px;
        }
        .exec-response-meta {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            margin-top: 6px;
        }

        /* ── Inline respond form ─────────────────────────────────────────────── */
        .respond-form {
            margin-top: 14px;
            padding: 16px;
            background: var(--color-bg-page);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
        }
        .respond-form-label {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wider);
            color: var(--color-text-muted);
            margin-bottom: 6px;
            display: block;
        }
        .respond-form textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            outline: none;
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
            font-family: var(--font-family);
            resize: vertical;
            transition: border-color 0.15s;
            box-sizing: border-box;
        }
        .respond-form textarea:focus { border-color: var(--color-accent); }
        .btn-respond {
            background: var(--color-info-subtle);
            color: var(--color-info);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(74,106,140,0.35);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-respond:hover { background: rgba(74,106,140,0.15); }
        .btn-acknowledge {
            background: var(--color-success);
            color: var(--color-text-inverse);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: none;
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-acknowledge:hover { background: var(--color-success-hover); }
        .form-field {
            width: 100%;
            padding: 14px 16px;
            background: var(--color-bg-page);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            outline: none;
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
            font-family: var(--font-family);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-field:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-border);
            background: var(--color-bg-surface);
        }
        .form-field::placeholder {
            color: var(--color-text-muted);
        }
        .form-label {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: var(--letter-spacing-wider);
            margin-bottom: 8px;
            display: block;
        }
        .btn-primary {
            background: var(--color-accent);
            color: var(--color-text-inverse);
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            border: none;
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            letter-spacing: var(--letter-spacing-wider);
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-primary:hover {
            background: var(--color-accent-hover);
        }
        .btn-secondary {
            background: var(--color-bg-hover);
            color: var(--color-text-secondary);
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            letter-spacing: var(--letter-spacing-wider);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-secondary:hover {
            background: var(--color-border);
            color: var(--color-text-primary);
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--color-border);
        }
        .section-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-primary);
            margin: 0;
        }
        .section-count {
            background: var(--color-accent-subtle);
            color: var(--color-accent);
            padding: 4px 12px;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
        }
        .empty-state-icon {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 16px;
        }
        .decision-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .decision-date {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            font-weight: var(--font-weight-medium);
        }
        .decision-approver {
            font-size: var(--font-size-sm);
            color: var(--color-accent);
            font-weight: var(--font-weight-bold);
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .btn-approve {
            background: var(--color-success);
            color: var(--color-text-inverse);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: none;
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-approve:hover {
            background: var(--color-success-hover);
        }
        .btn-edit {
            background: var(--color-bg-hover);
            color: var(--color-text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-edit:hover {
            background: var(--color-border);
            color: var(--color-text-primary);
        }
        .btn-escalate {
            background: var(--color-bg-hover);
            color: var(--color-text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-escalate:hover {
            background: var(--color-border);
            color: var(--color-text-primary);
        }
        .btn-escalate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Escalate toggle ─────────────────────────────────────────────────── */
        .escalate-toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #f5f3ff;
            border: 1px solid #c4b5fd;
            border-radius: var(--radius-lg);
            cursor: pointer;
        }
        .escalate-toggle-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #7c3aed;
            cursor: pointer;
        }
        .escalate-toggle-label {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-bold);
            color: #7c3aed;
            cursor: pointer;
            user-select: none;
        }
        .escalate-toggle-sub {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            margin-left: auto;
        }
    </style>
</head>
<body>
    <!-- Sidebar will be injected by sidebar-component.js -->
    <aside class="sidebar flex flex-col" style="padding: 20px 12px 14px;">
        <!-- Content will be replaced by JavaScript -->
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <div class="dl-layout">

            <!-- Page Header (full width) -->
            <div class="dl-header">
                <h1 style="font-size:var(--font-size-3xl);font-weight:var(--font-weight-bold);color:var(--color-text-primary);letter-spacing:var(--letter-spacing-tight);margin-bottom:4px;">Decision Log</h1>
                <p style="color:var(--color-text-secondary);font-size:var(--font-size-base);">Track and manage important decisions across your product development journey.</p>
            </div>

            <!-- Add Decision Form -->
            <div class="decision-card">
                <h2 style="font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);color:var(--color-text-primary);margin-bottom:20px;">Add New Decision</h2>
                <form id="decisionForm">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                        <div>
                            <label class="form-label" for="decisionName">Decision Name</label>
                            <input type="text" id="decisionName" class="form-field" placeholder="e.g., Q1 Feature Prioritization" required>
                        </div>
                        <div>
                            <label class="form-label" for="decisionDate">Date</label>
                            <input type="date" id="decisionDate" class="form-field" required>
                        </div>
                    </div>
                    <div style="margin-bottom:16px;">
                        <label class="form-label" for="decisionDescription">Description</label>
                        <textarea id="decisionDescription" class="form-field" rows="3" placeholder="Describe the decision context, options considered, and rationale..." required></textarea>
                    </div>
                    <div style="margin-bottom:16px;">
                        <label class="form-label" for="decisionApprover">Proposed Approver</label>
                        <input type="text" id="decisionApprover" class="form-field" placeholder="e.g., Product Committee, CEO, CTO">
                    </div>
                    <div style="margin-bottom:20px;position:relative;">
                        <label class="form-label">Linked OKRs</label>
                        <div id="okrCombobox" style="min-height:40px;padding:6px 10px;border:1px solid var(--color-border);
                             border-radius:var(--radius-md);background:var(--color-bg-card);cursor:pointer;
                             display:flex;flex-wrap:wrap;gap:6px;align-items:center;"
                             onclick="toggleOkrDropdown(event)">
                            <span id="okrComboPlaceholder" style="font-size:var(--font-size-sm);color:var(--color-text-muted);">Select OKRs…</span>
                        </div>
                        <div id="okrDropdown" style="display:none;position:absolute;z-index:200;left:0;right:0;top:calc(100% + 4px);
                             background:var(--color-bg-card);border:1px solid var(--color-border);
                             border-radius:var(--radius-md);box-shadow:var(--shadow-card);max-height:220px;overflow-y:auto;">
                        </div>
                    </div>
                    <label class="escalate-toggle-row" id="escalateToggleRow" style="display: none;">
                        <input type="checkbox" id="escalateToggle">
                        <span class="escalate-toggle-label">Escalate to Executive</span>
                        <span class="escalate-toggle-sub">Creates a linked copy in your Executive instance</span>
                    </label>
                    <div style="display:flex;gap:12px;">
                        <button type="submit" class="btn-primary">Add Decision</button>
                        <button type="button" class="btn-secondary" onclick="clearForm()">Clear</button>
                    </div>
                </form>
            </div>

            <!-- Pending Decisions -->
            <div>
                <div class="section-header">
                    <h2 class="section-title">Pending</h2>
                    <span class="section-count" id="pendingCount">0</span>
                </div>
                <div id="pendingDecisions">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>No pending decisions</p>
                    </div>
                </div>
            </div>

            <!-- Approved Decisions -->
            <div>
                <div class="section-header">
                    <h2 class="section-title">Approved</h2>
                    <span class="section-count" id="approvedCount">0</span>
                </div>
                <div id="approvedDecisions">
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <p>No approved decisions yet</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/shared/sidebar-component.js"></script>
    <script>
        // Check for executive mode and hide escalate checkbox if needed
        function checkExecutiveMode() {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar && sidebar.style.background === 'var(--color-bg-sidebar)') {
                // Executive mode detected - hide escalate checkbox
                const escalateRow = document.getElementById('escalateToggleRow');
                if (escalateRow) {
                    escalateRow.style.display = 'none';
                }
            } else {
                // PM mode - show escalate checkbox
                const escalateRow = document.getElementById('escalateToggleRow');
                if (escalateRow) {
                    escalateRow.style.display = 'flex';
                }
            }
        }

        // Listen for sidebar ready event
        window.addEventListener('sidebarReady', checkExecutiveMode);
        
        // Also check immediately in case sidebar is already loaded
        setTimeout(checkExecutiveMode, 100);

        // Decision Log JavaScript
        let decisions       = [];
        let editingId       = null;
        let _pendingSources = [];
        let _pendingOkrIds  = [];
        let _availableOkrs  = [];   // [{ id, text }]
        let _isExecMode     = false;
        let _instancesMap   = {}; // id → name

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await Auth.requireAuth();
            if (!ok) return;

            _isExecMode = Auth.getActiveInstanceType() === 'executive';

            // Build instance name map for source attribution on escalated decisions
            const instRes = await Auth.fetch('/api/instances').catch(() => null);
            if (instRes?.ok) {
                const list = await instRes.json();
                list.forEach(i => { _instancesMap[i.id] = i.name; });
            }

            // Load OKRs for combobox
            const settingsRes = await Auth.fetch('/api/settings').catch(() => null);
            if (settingsRes?.ok) {
                const s = await settingsRes.json();
                _availableOkrs = (s.objectives || []).map(o =>
                    typeof o === 'string' ? { id: o, text: o } : { id: o.id || o.text, text: o.text }
                ).filter(o => o.text);
            }

            loadDecisions();
            setupEventListeners();
            checkForPendingDecision();

            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('decisionDate').value = today;
        });

        function checkForPendingDecision() {
            const raw = localStorage.getItem('pendingDecision');
            if (!raw) return;
            localStorage.removeItem('pendingDecision');
            try {
                const data = JSON.parse(raw);

                // ── Standard format: { items: SolutionItem[], name, date, approver } ──
                if (Array.isArray(data.items) && data.items.length) {
                    const items = data.items;

                    document.getElementById('decisionName').value =
                        data.name || (items.length === 1 ? items[0].title : '');

                    document.getElementById('decisionDescription').value = items.map((item, i) => {
                        const parts = [];
                        if (items.length > 1) parts.push(`[${i + 1}] ${item.title}`);
                        if (item.description) parts.push(item.description);
                        return parts.join('\n');
                    }).join('\n\n---\n\n');

                    document.getElementById('decisionDate').value     = data.date     || new Date().toISOString().split('T')[0];
                    document.getElementById('decisionApprover').value = data.approver || '';

                    // Aggregate sources from all items, preserving entry_id for persistent linking
                    _pendingSources = items.flatMap(item =>
                        (item.sources || []).map(s => ({
                            label: s.label,
                            ...(s.entry_id != null && { entry_id: s.entry_id }),
                            ...(s.value    != null && { value:    s.value    }),
                            ...(s.tag      != null && { tag:      s.tag      }),
                        }))
                    );

                } else {
                    // ── Legacy format: { name, description, date, approver, sources } ──
                    document.getElementById('decisionName').value        = data.name        || '';
                    document.getElementById('decisionDescription').value = data.description || '';
                    document.getElementById('decisionDate').value        = data.date        || '';
                    document.getElementById('decisionApprover').value    = data.approver    || '';
                    _pendingSources = data.sources || [];
                }

                // Pre-select OKRs if present in payload
                const allOkrIds = data.items
                    ? data.items.flatMap(item => item.okr_ids || [])
                    : (data.okr_ids || []);
                _pendingOkrIds = [...new Set(allOkrIds)];
                renderOkrTags();

                document.getElementById('decisionName').focus();
                renderPendingSourcesPreview();
                showNotification('Decision data pre-filled from selection');
            } catch (err) {
                console.error('Error parsing pending decision:', err);
            }
        }

        function renderPendingSourcesPreview() {
            const existing = document.getElementById('pendingSourcesPreview');
            if (existing) existing.remove();
            if (!_pendingSources.length) return;

            const preview = document.createElement('div');
            preview.id = 'pendingSourcesPreview';
            preview.style.cssText = 'margin-bottom:16px;';
            preview.innerHTML = `
                <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;
                             color:var(--color-text-muted);display:block;margin-bottom:8px;">
                    Sources &amp; Related <span style="color:var(--color-accent);font-style:normal;">(${_pendingSources.length})</span>
                </span>
                <div style="display:flex;flex-direction:column;gap:6px;">
                    ${_pendingSources.map(s => `
                    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;
                                padding:7px 12px;background:var(--color-bg-page);
                                border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:13px;">
                        <span style="color:var(--color-text-primary);font-weight:500;min-width:0;
                                     overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.label)}</span>
                        ${s.tag ? `<span style="font-size:10px;font-weight:700;color:var(--color-accent);
                                     background:var(--color-accent-subtle);padding:2px 8px;
                                     border-radius:9999px;flex-shrink:0;white-space:nowrap;">${escapeHtml(s.tag)}</span>` : ''}
                    </div>`).join('')}
                </div>`;

            const submitRow = document.querySelector('#decisionForm > div:last-child');
            document.getElementById('decisionForm').insertBefore(preview, submitRow);
        }

        // ── OKR Combobox ──────────────────────────────────────────────────────
        function toggleOkrDropdown(e) {
            e.stopPropagation();
            const dd = document.getElementById('okrDropdown');
            if (dd.style.display === 'none') {
                renderOkrDropdown();
                dd.style.display = 'block';
            } else {
                dd.style.display = 'none';
            }
        }

        function renderOkrDropdown() {
            const dd = document.getElementById('okrDropdown');
            if (!_availableOkrs.length) {
                dd.innerHTML = `<div style="padding:12px;font-size:var(--font-size-sm);color:var(--color-text-muted);">No OKRs defined in Settings.</div>`;
                return;
            }
            dd.innerHTML = _availableOkrs.map(o => {
                const selected = _pendingOkrIds.includes(o.id);
                return `<div onclick="toggleOkrSelection('${escapeHtml(o.id)}')"
                     style="display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
                            font-size:var(--font-size-sm);color:var(--color-text-primary);
                            background:${selected ? 'var(--color-accent-subtle)' : 'transparent'};
                            border-bottom:1px solid var(--color-border);"
                     onmouseover="this.style.background='var(--color-bg-hover)'"
                     onmouseout="this.style.background='${selected ? 'var(--color-accent-subtle)' : 'transparent'}'">
                    <span style="font-size:11px;color:${selected ? 'var(--color-accent)' : 'var(--color-border)'};font-weight:700;">${selected ? '✓' : '○'}</span>
                    ${escapeHtml(o.text)}
                </div>`;
            }).join('');
        }

        function toggleOkrSelection(okrId) {
            if (_pendingOkrIds.includes(okrId)) {
                _pendingOkrIds = _pendingOkrIds.filter(id => id !== okrId);
            } else {
                _pendingOkrIds.push(okrId);
            }
            renderOkrTags();
            renderOkrDropdown();
        }

        function renderOkrTags() {
            const box         = document.getElementById('okrCombobox');
            const placeholder = document.getElementById('okrComboPlaceholder');
            // Remove existing tags
            box.querySelectorAll('.okr-tag').forEach(t => t.remove());
            if (_pendingOkrIds.length === 0) {
                placeholder.style.display = '';
            } else {
                placeholder.style.display = 'none';
                _pendingOkrIds.forEach(id => {
                    const okr = _availableOkrs.find(o => o.id === id);
                    if (!okr) return;
                    const tag = document.createElement('span');
                    tag.className = 'okr-tag';
                    tag.style.cssText = `display:inline-flex;align-items:center;gap:5px;padding:2px 8px;
                        background:var(--color-accent-subtle);color:var(--color-accent);
                        border-radius:9999px;font-size:11px;font-weight:600;white-space:nowrap;`;
                    tag.innerHTML = `🎯 ${escapeHtml(okr.text.length > 40 ? okr.text.slice(0, 40) + '…' : okr.text)}
                        <span onclick="event.stopPropagation();toggleOkrSelection('${escapeHtml(id)}')"
                              style="cursor:pointer;font-weight:700;margin-left:2px;">×</span>`;
                    box.insertBefore(tag, placeholder);
                });
            }
        }

        // Close dropdown on outside click
        document.addEventListener('click', () => {
            const dd = document.getElementById('okrDropdown');
            if (dd) dd.style.display = 'none';
        });

        function showNotification(message, isError) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${isError ? 'var(--color-warning)' : 'var(--color-success)'};
                color: var(--color-text-inverse);
                padding: 12px 20px;
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-card);
                z-index: 10000;
                font-size: var(--font-size-sm);
                font-weight: var(--font-weight-medium);
                max-width: 360px;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3500);
        }

        function setupEventListeners() {
            document.getElementById('decisionForm').addEventListener('submit', handleFormSubmit);
        }

        async function loadDecisions() {
            try {
                const res = await Auth.fetch('/api/decisions');
                if (res.ok) {
                    decisions = await res.json();
                    renderDecisions();
                } else {
                    console.error('Failed to load decisions');
                }
            } catch (err) {
                console.error('Error loading decisions:', err);
            }
        }

        async function saveDecisions() {
            const res = await Auth.fetch('/api/decisions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ decisions })
            });
            if (!res.ok) throw new Error('Failed to save decisions');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const name = document.getElementById('decisionName').value.trim();
            const description = document.getElementById('decisionDescription').value.trim();
            const date = document.getElementById('decisionDate').value;
            const approver = document.getElementById('decisionApprover').value.trim();
            const shouldEscalate = !editingId && document.getElementById('escalateToggle').checked;

            if (!name || !description || !date) {
                alert('Please fill in all required fields');
                return;
            }

            const decision = {
                id: editingId || Date.now().toString(),
                name,
                description,
                date,
                approver,
                status: 'pending',
                sources:    editingId ? (decisions.find(d => d.id === editingId)?.sources    || []) : _pendingSources,
                source_ids: editingId ? (decisions.find(d => d.id === editingId)?.source_ids || []) : _pendingSources.filter(s => s.entry_id).map(s => s.entry_id),
                okr_ids:    editingId ? (decisions.find(d => d.id === editingId)?.okr_ids    || []) : [..._pendingOkrIds],
                createdAt: editingId ? decisions.find(d => d.id === editingId)?.createdAt : new Date().toISOString(),
                approvedAt: null
            };

            if (editingId) {
                const index = decisions.findIndex(d => d.id === editingId);
                decisions[index] = { ...decisions[index], ...decision };
                editingId = null;
            } else {
                decisions.unshift(decision);
            }

            try {
                await saveDecisions();
                renderDecisions();
                _pendingSources = [];
                clearForm();

                if (shouldEscalate) {
                    await escalateDecision(decision.id);
                }
            } catch (err) {
                showNotification('Failed to save decision', true);
                console.error(err);
            }
        }

        function clearForm() {
            document.getElementById('decisionForm').reset();
            document.getElementById('decisionDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('escalateToggle').checked = false;
            editingId       = null;
            _pendingSources = [];
            _pendingOkrIds  = [];
            renderOkrTags();
            const preview = document.getElementById('pendingSourcesPreview');
            if (preview) preview.remove();
        }

        async function escalateDecision(id) {
            try {
                const res = await Auth.fetch('/api/decisions/escalate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decisionId: id })
                });
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    if (res.status === 404 && body.error?.includes('No executive instance')) {
                        showNotification('No Executive instance found. Create one in Settings first.', true);
                    } else {
                        showNotification(body.error || 'Failed to escalate decision', true);
                    }
                    return;
                }
                // Reload to get the updated decision with escalated flag
                await loadDecisions();
                showNotification('Decision escalated to Executive instance');
            } catch (err) {
                console.error('Escalate error:', err);
                showNotification('Failed to escalate decision', true);
            }
        }

        function renderDecisions() {
            const pending  = decisions.filter(d => d.status === 'pending' || d.status === 'awaiting_acknowledgment');
            const approved = decisions.filter(d => d.status === 'approved');

            document.getElementById('pendingCount').textContent = pending.length;
            document.getElementById('approvedCount').textContent = approved.length;

            const pendingContainer = document.getElementById('pendingDecisions');
            pendingContainer.innerHTML = pending.length === 0
                ? `<div class="empty-state"><div class="empty-state-icon">📋</div><p>No pending decisions</p></div>`
                : pending.map(d => renderDecisionCard(d)).join('');

            const approvedContainer = document.getElementById('approvedDecisions');
            approvedContainer.innerHTML = approved.length === 0
                ? `<div class="empty-state"><div class="empty-state-icon">✅</div><p>No approved decisions yet</p></div>`
                : approved.map(d => renderDecisionCard(d)).join('');
        }

        function renderSourcesSection(sources) {
            if (!sources || !sources.length) return '';
            const rows = sources.map(s => `
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;
                            padding:7px 12px;background:var(--color-bg-page);
                            border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:13px;">
                    <span style="color:var(--color-text-primary);font-weight:500;min-width:0;
                                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.label)}</span>
                    ${s.tag ? `<span style="font-size:10px;font-weight:700;color:var(--color-accent);
                                 background:var(--color-accent-subtle);padding:2px 8px;
                                 border-radius:9999px;flex-shrink:0;white-space:nowrap;">${escapeHtml(s.tag)}</span>` : ''}
                </div>`).join('');
            return `
                <div style="margin-bottom:16px;padding:14px 16px;background:var(--color-bg-hover);
                            border:1px solid var(--color-border);border-radius:var(--radius-lg);">
                    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;
                                color:var(--color-text-muted);margin-bottom:10px;">
                        Sources &amp; Related
                    </div>
                    <div style="display:flex;flex-direction:column;gap:6px;">${rows}</div>
                </div>`;
        }

        function renderOkrBadges(okrIds) {
            if (!okrIds?.length) return '';
            const badges = okrIds.map(id => {
                const okr = _availableOkrs.find(o => o.id === id);
                const label = okr ? okr.text : id;
                return `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
                    background:var(--color-accent-subtle);color:var(--color-accent);
                    border-radius:9999px;font-size:11px;font-weight:600;white-space:nowrap;">
                    🎯 ${escapeHtml(label.length > 50 ? label.slice(0, 50) + '…' : label)}
                </span>`;
            }).join('');
            return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">${badges}</div>`;
        }

        function renderDecisionCard(decision) {
            const status    = decision.status;
            const isPending = status === 'pending';
            const isAwaiting = status === 'awaiting_acknowledgment';
            const isApproved = status === 'approved';

            const cardClass = isApproved ? 'approved' : isAwaiting ? 'awaiting_acknowledgment' : 'pending';

            const statusBadge = isPending
                ? '<span class="status-badge pending">Pending</span>'
                : isAwaiting
                ? '<span class="status-badge awaiting_acknowledgment">Awaiting Acknowledgment</span>'
                : '<span class="status-badge approved">Approved</span>';

            const escalatedBadge = decision.escalated
                ? '<span class="status-badge escalated">Escalated to Executive</span>'
                : '';
            const sourceName = decision.isEscalation && decision.linkedPmInstanceId
                ? (_instancesMap[decision.linkedPmInstanceId] || decision.linkedPmInstanceId)
                : null;
            const escalationBadge = decision.isEscalation
                ? `<span class="status-badge escalated">From Escalation</span>${sourceName ? `<span style="font-size:var(--font-size-xs);color:var(--color-text-muted);font-weight:var(--font-weight-medium);">↳ ${escapeHtml(sourceName)}</span>` : ''}`
                : '';

            // Exec: respond button on pending escalated decisions
            const respondBtn = _isExecMode && decision.isEscalation && isPending
                ? `<button class="btn-respond" onclick="toggleRespondForm('${decision.id}')">Respond →</button>`
                : '';

            // Exec: respond form (hidden by default, toggled inline)
            const respondForm = _isExecMode && decision.isEscalation && isPending ? `
                <div class="respond-form" id="respond-form-${decision.id}" style="display:none;">
                    <div style="margin-bottom:12px;">
                        <label class="respond-form-label">Decision taken <span style="color:var(--color-danger);">*</span></label>
                        <textarea id="respond-text-${decision.id}" rows="3" placeholder="Describe the decision taken…"></textarea>
                    </div>
                    <div style="margin-bottom:12px;">
                        <label class="respond-form-label">Rationale <span style="opacity:0.5;font-weight:500;text-transform:none;letter-spacing:0;">(optional)</span></label>
                        <textarea id="respond-rationale-${decision.id}" rows="2" placeholder="Why this decision was taken…"></textarea>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn-approve" onclick="submitResponse('${decision.id}')">Submit Response</button>
                        <button class="btn-edit" onclick="toggleRespondForm('${decision.id}')">Cancel</button>
                    </div>
                </div>` : '';

            // Exec response box: shown in both modes when a response exists and decision is awaiting or approved
            const execResponseBox = decision.execResponse && (isAwaiting || isApproved) ? `
                <div class="exec-response-box">
                    <div class="exec-response-label">Executive Response</div>
                    <div class="exec-response-text">${escapeHtml(decision.execResponse.text)}</div>
                    ${decision.execResponse.rationale
                        ? `<div class="exec-response-rationale">${escapeHtml(decision.execResponse.rationale)}</div>`
                        : ''}
                    <div class="exec-response-meta">Responded ${formatDate(decision.execResponse.respondedAt)}</div>
                </div>` : '';

            const acknowledgeBtn = !_isExecMode && isAwaiting
                ? `<button class="btn-acknowledge" onclick="acknowledgeDecision('${decision.id}')">Acknowledge</button>`
                : '';

            // PM: local approve + escalate (only on pending, non-escalated)
            const approveBtn  = isPending ? `<button class="btn-approve" onclick="approveDecision('${decision.id}')">Approve</button>` : '';
            const escalateBtn = isPending && !decision.escalated && !_isExecMode
                ? `<button class="btn-escalate" onclick="escalateDecision('${decision.id}')">Escalate to Executive</button>`
                : '';

            return `
                <div class="decision-card ${cardClass}">
                    <div class="decision-meta">
                        <h3 class="text-lg font-bold text-slate-900 mb-2">${escapeHtml(decision.name)}</h3>
                        ${statusBadge}
                        ${escalatedBadge}
                        ${escalationBadge}
                    </div>
                    <div class="decision-meta">
                        <span class="decision-date">📅 ${formatDate(decision.date)}</span>
                        ${decision.approver ? `<span class="decision-approver">👤 ${escapeHtml(decision.approver)}</span>` : ''}
                        ${decision.approvedAt ? `<span class="decision-date">✅ Approved: ${formatDate(decision.approvedAt)}</span>` : ''}
                    </div>
                    <p class="text-slate-700 leading-relaxed mb-4">${escapeHtml(decision.description)}</p>
                    ${renderOkrBadges(decision.okr_ids)}
                    ${renderSourcesSection(decision.sources)}
                    ${execResponseBox}
                    ${respondForm}
                    <div class="action-buttons">
                        ${approveBtn}
                        ${acknowledgeBtn}
                        ${respondBtn}
                        <button class="btn-edit" onclick="editDecision('${decision.id}')">Edit</button>
                        <button class="btn-edit" onclick="deleteDecision('${decision.id}')">Delete</button>
                        ${escalateBtn}
                    </div>
                </div>
            `;
        }

        function toggleRespondForm(id) {
            const form = document.getElementById(`respond-form-${id}`);
            if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function submitResponse(id) {
            const responseText = document.getElementById(`respond-text-${id}`)?.value.trim();
            const rationale    = document.getElementById(`respond-rationale-${id}`)?.value.trim();
            if (!responseText) { showNotification('Decision text is required', true); return; }

            try {
                const res = await Auth.fetch('/api/decisions/respond', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decisionId: id, response: responseText, rationale }),
                });
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    showNotification(body.error || 'Failed to submit response', true);
                    return;
                }
                await loadDecisions();
                showNotification('Response submitted');
            } catch (err) {
                console.error('submitResponse error:', err);
                showNotification('Failed to submit response', true);
            }
        }

        async function acknowledgeDecision(id) {
            try {
                const res = await Auth.fetch('/api/decisions/acknowledge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decisionId: id }),
                });
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    showNotification(body.error || 'Failed to acknowledge', true);
                    return;
                }
                await loadDecisions();
                showNotification('Decision acknowledged and closed');
            } catch (err) {
                console.error('acknowledgeDecision error:', err);
                showNotification('Failed to acknowledge', true);
            }
        }

        async function approveDecision(id) {
            if (confirm('Are you sure you want to approve this decision?')) {
                const decision = decisions.find(d => d.id === id);
                if (decision) {
                    decision.status = 'approved';
                    decision.approvedAt = new Date().toISOString();
                    await saveDecisions();
                    renderDecisions();
                }
            }
        }

        function editDecision(id) {
            const decision = decisions.find(d => d.id === id);
            if (decision) {
                document.getElementById('decisionName').value        = decision.name;
                document.getElementById('decisionDescription').value = decision.description;
                document.getElementById('decisionDate').value        = decision.date;
                document.getElementById('decisionApprover').value    = decision.approver || '';
                _pendingOkrIds = [...(decision.okr_ids || [])];
                renderOkrTags();
                editingId = id;
                document.getElementById('decisionName').focus();
            }
        }

        async function deleteDecision(id) {
            if (confirm('Are you sure you want to delete this decision?')) {
                decisions = decisions.filter(d => d.id !== id);
                await saveDecisions();
                renderDecisions();
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
