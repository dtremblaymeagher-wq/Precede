<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">PM AI Toolkit</title>
    <link rel="stylesheet" href="/shared/style.generated.css">
    <script src="https://unpkg.com/@clerk/clerk-js@4/dist/clerk.browser.js"
            data-clerk-publishable-key="pk_test_dmFzdC1wZWdhc3VzLTQzLmNsZXJrLmFjY291bnRzLmRldiQ"
            type="text/javascript" crossorigin="anonymous"></script>
    <script src="/shared/auth.js"></script>
    <link rel="stylesheet" href="/shared/design-tokens.css">
    <link rel="stylesheet" href="/shared/layout.css">
    <style>
        .sidebar-section-label {
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-muted);
            letter-spacing: var(--letter-spacing-wider);
            text-transform: uppercase;
            padding: 0 10px;
            margin: 14px 0 8px;
            border-top: 1px solid var(--color-border);
            padding-top: 14px;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 10px; }

        /* Responsive sidebar */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .mobile-menu-toggle {
                display: block;
                position: fixed;
                top: 16px;
                left: 16px;
                z-index: 1001;
                background: var(--color-bg-surface);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                padding: 8px;
                cursor: pointer;
                box-shadow: var(--shadow-card);
            }
            .main-content {
                margin-left: 0 !important;
                padding: 60px 16px 16px !important;
            }
        }

        @media (min-width: 769px) {
            .mobile-menu-toggle {
                display: none;
            }
        }

        /* Overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .sidebar-overlay.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Sidebar will be injected by sidebar-component.js -->
    <aside class="sidebar flex flex-col" style="padding: 20px 12px 14px;">
        <!-- Content will be replaced by JavaScript -->
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <!-- Page content will be inserted here -->
    </div>

    <script src="/shared/sidebar-component.js"></script>
</body>
</html>
